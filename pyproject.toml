[project]
name = "research-swarm"
version = "0.1.0"
description = "Multi-agent deep-research system built on LangGraph: plans, searches, reads, cross-checks contradictions and synthesizes a cited report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    # ASGI app (src/research_swarm/server.py). Core rather than optional because
    # serverless platforms install only the base dependency set - see [tool.vercel].
    "fastapi>=0.115",
]

[project.optional-dependencies]
# LLM backends - install the one you have a key for.
google = ["langchain-google-genai>=2.0"]
openai = ["langchain-openai>=0.3"]
anthropic = ["langchain-anthropic>=0.3"]
# Optional search SDK (the Tavily/Exa/SerpAPI providers also work with plain HTTP,
# so no SDK is strictly required).
tavily = ["tavily-python>=0.5"]
# Streaming web UI (SSE over FastAPI). Kept optional so the CLI stays lean.
# uvicorn only - fastapi is already a core dependency.
web = ["uvicorn>=0.34"]
all = [
    "langchain-google-genai>=2.0",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
research-swarm = "research_swarm.cli:main"
research-web = "research_swarm.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# packages zaten static/ alt dizinini de kapsar; ayrıca force-include
# vermek aynı dosyayı iki kez ekler ve hatchling non-editable wheel
# build'inde hata fırlatır (Vercel --no-editable kullanır).
packages = ["src/research_swarm"]

# Vercel's Python runtime looks for an ASGI app in a handful of default
# filenames (app.py, main.py, server.py, ...). Our app lives inside the package,
# so the entrypoint is declared explicitly: module path + ":" + app variable.
[tool.vercel]
entrypoint = "src.research_swarm.server:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
